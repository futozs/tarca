name: E2E

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    if: github.repository == 'futozs/tarca'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: A Billingo spec letöltése (az élő válaszok a javított spec ellen mennek)
        run: npm run spec:fetch
      - name: Élő e2e a Billingo teszt profilján
        env:
          TARCA_REQUIRE_SPEC: '1'
          BILLINGO_TEST_API_KEY: ${{ secrets.BILLINGO_TEST_API_KEY }}
          BILLINGO_E2E_EMAIL: ${{ secrets.BILLINGO_E2E_EMAIL }}
          BILLINGO_E2E_TAX_CODE: ${{ vars.BILLINGO_E2E_TAX_CODE }}
        run: npm run e2e
